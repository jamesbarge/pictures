name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The frontend E2E job drives ~200 page loads against the live production API,
# and those routes are rate limited per client IP. Superseding in-flight runs
# keeps a busy PR queue from multiplying that load (and the Upstash spend behind
# it) several-fold.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # git fetch/push can stall on HTTP/2 on some networks; pin HTTP/1.1 so any raw
      # git op (checkout, any future push) can't hang and burn runner minutes.
      - name: Pin git transport to HTTP/1.1
        run: git config --global http.version HTTP/1.1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:run

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # The suite that covers pictures.london (SvelteKit, frontend/). It drives the
  # built bundle through `vite preview` and proxies /api to the production API,
  # so it needs no database and no secrets. Keep this job green.
  frontend-e2e:
    name: Frontend E2E (pictures.london)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    env:
      # Vite proxies /api here for the preview server, mirroring the Vercel
      # rewrite in frontend/vercel.json.
      API_PROXY_TARGET: https://api.pictures.london
      # Baked in at build time via $env/static/public, so it must be defined or
      # the build fails. Empty disables PostHog, which is what we want for E2E:
      # no analytics noise. (No Clerk var here — the frontend has no auth; Clerk
      # lives only in the root Next.js job below.)
      PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY || '' }}
      PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Vitest (frontend/src/**/*.test.ts); Playwright only runs *.spec.ts.
      - name: Run unit tests
        run: npm test

      # WebKit is REQUIRED, not optional. tests/mobile.spec.ts does
      # `test.use(devices['iPhone 12 Pro'])`, and that descriptor carries
      # `defaultBrowserType: 'webkit'`. The `chromium` project pins `browserName`
      # so it wins there, but `mobile-small` (Galaxy S5) sets no explicit
      # browserName, so the file-level device wins and those tests resolve to
      # WebKit. Installing chromium alone failed 31 of them with
      # "Executable doesn't exist at .../webkit-XXXX/pw_run.sh". Keeping WebKit is
      # the right call rather than pinning the project to chromium: mobile is ~2/3
      # of real traffic and iOS Safari dominates it, so this is the engine we most
      # need covered.
      - name: Install Playwright browsers
        run: npx playwright install chromium webkit --with-deps

      # `test:e2e:ci` builds first, so `vite preview` can never serve a stale or
      # absent bundle. Keeping the build inside the script means the local and
      # CI paths are the same command.
      - name: Build and run E2E tests
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-playwright-report
          # test-results/ carries the traces and failure screenshots; without it
          # a red build uploads a report with nothing to open.
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  # Builds the root Next.js app (API + admin), so a broken redirects() rule or
  # route fails here before it reaches Vercel. The build needs no secrets.
  #
  # The job name stays "E2E Tests" ON PURPOSE: branch protection on main lists
  # it as a required status check, and GitHub matches those by name, so
  # renaming it would leave every PR waiting forever on a check that can no
  # longer report. Rename only in the same change that updates the ruleset.
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Pin HTTP/1.1 for git ops; avoids HTTP/2 fetch stalls (see unit-tests job).
      - name: Pin git transport to HTTP/1.1
        run: git config --global http.version HTTP/1.1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build root app
        run: npm run build
