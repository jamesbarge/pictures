name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The frontend E2E job drives ~200 page loads against the live production API,
# and those routes are rate limited per client IP. Superseding in-flight runs
# keeps a busy PR queue from multiplying that load (and the Upstash spend behind
# it) several-fold.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:run

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # The suite that covers pictures.london (SvelteKit, frontend/). It drives the
  # built bundle through `vite preview` and proxies /api to the production API,
  # so it needs no database and no secrets. Keep this job green.
  frontend-e2e:
    name: Frontend E2E (pictures.london)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    env:
      # Vite proxies /api here for the preview server, mirroring the Vercel
      # rewrite in frontend/vercel.json.
      API_PROXY_TARGET: https://api.pictures.london
      # Baked in at build time via $env/static/public, so it must be defined or
      # the build fails. Empty disables PostHog, which is what we want for E2E:
      # no analytics noise. (No Clerk var here — the frontend has no auth; Clerk
      # lives only in the root Next.js job below.)
      PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY || '' }}
      PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # `test:e2e:ci` builds first, so `vite preview` can never serve a stale or
      # absent bundle. Keeping the build inside the script means the local and
      # CI paths are the same command.
      - name: Build and run E2E tests
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-playwright-report
          # test-results/ carries the traces and failure screenshots; without it
          # a red build uploads a report with nothing to open.
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  # Legacy suite: drives the old Next.js UI at localhost:3000, which is not
  # pictures.london. Left as-is deliberately; it is NOT counted as E2E coverage
  # by test-summary below.
  #
  # The display name stays "E2E Tests" ON PURPOSE: branch protection on main
  # lists it as a required status check, and GitHub matches those by name, so
  # renaming it would leave every PR waiting forever on a check that can no
  # longer report. Rename only in the same change that updates the ruleset.
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # E2E tests require DATABASE_URL_TEST secret configured in GitHub

    env:
      # Use test database for E2E tests
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}

    steps:
      - name: Check if DATABASE_URL_TEST is configured
        id: check-db
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL_TEST not configured, skipping E2E tests"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "DATABASE_URL_TEST is configured"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check-db.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check-db.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check-db.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.check-db.outputs.skip != 'true'
        run: npx playwright install chromium --with-deps

      - name: Build application
        if: steps.check-db.outputs.skip != 'true'
        run: npm run build
        env:
          # Minimal env vars for build
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY || 'disabled' }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST || 'https://app.posthog.com' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'disabled' }}

      - name: Run E2E tests
        if: steps.check-db.outputs.skip != 'true'
        run: npm run test:e2e
        env:
          CI: true

      - name: Warn that E2E tests were skipped (no database)
        if: steps.check-db.outputs.skip == 'true'
        run: |
          echo "::notice title=Legacy E2E skipped::DATABASE_URL_TEST is not configured, so the legacy Next.js UI suite did not run. This does not affect coverage of pictures.london — that is the 'Frontend E2E' job, which always runs."

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure() && steps.check-db.outputs.skip != 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Summary job that depends on unit tests and both E2E suites
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-e2e, e2e-tests]
    if: always()

    steps:
      - name: Check test results
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          FRONTEND_E2E_RESULT: ${{ needs.frontend-e2e.result }}
          LEGACY_E2E_RESULT: ${{ needs.e2e-tests.result }}
        run: |
          failed=0

          if [ "$UNIT_RESULT" != "success" ]; then
            echo "::error title=Unit tests failed::result=$UNIT_RESULT"
            failed=1
          fi

          # The frontend suite covers pictures.london and needs no secret, so a
          # skip means something is misconfigured — never coverage. Treating a
          # skipped E2E job as a pass is exactly what let a poster regression
          # reach production behind a green tick (PR #736).
          if [ "$FRONTEND_E2E_RESULT" != "success" ]; then
            echo "::error title=Frontend E2E did not pass::result=$FRONTEND_E2E_RESULT — a skipped or cancelled run counts as a failure here, because this suite requires no secrets."
            failed=1
          fi

          # The legacy suite drives the old Next.js UI, not pictures.london. It
          # stays optional and is deliberately NOT counted as E2E coverage.
          if [ "$LEGACY_E2E_RESULT" != "success" ] && [ "$LEGACY_E2E_RESULT" != "skipped" ]; then
            echo "::error title=Legacy E2E failed::result=$LEGACY_E2E_RESULT"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All required tests passed!"
