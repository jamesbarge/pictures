<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0a0a0a" />
		<!-- Favicon: hand-drawn P with red dot. Small sizes are contrast-boosted
		     crops of the 1254px original (static/icon-512.png is the high-res master). -->
		<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="preconnect" href="https://image.tmdb.org" />
		<!-- Spline Sans is the redesign's sole above-the-fold face (latin subset
		     covers first paint; latin-ext loads on demand via unicode-range). -->
		<link rel="preload" href="/fonts/SplineSans.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			// Apply a collapsed desktop sidebar before first paint, so it never
			// shows open and then snaps shut. Kept in sync by stores/shell.svelte.ts.
			try {
				if (localStorage.getItem('pictures-sidebar-collapsed') === '1') {
					document.documentElement.setAttribute('data-sidebar-collapsed', '');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
