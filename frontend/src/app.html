<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0a0a0a" />
		<link rel="preconnect" href="https://image.tmdb.org" />
		<!-- Spline Sans is the redesign's sole above-the-fold face (latin subset
		     covers first paint; latin-ext loads on demand via unicode-range). -->
		<link rel="preload" href="/fonts/SplineSans.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			// Apply a collapsed desktop sidebar before first paint, so it never
			// shows open and then snaps shut. Kept in sync by stores/shell.svelte.ts.
			try {
				if (localStorage.getItem('pictures-sidebar-collapsed') === '1') {
					document.documentElement.setAttribute('data-sidebar-collapsed', '');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
